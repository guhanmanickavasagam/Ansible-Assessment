
---
- name: Install and Configure Prometheus and Grafana
  hosts: server1
  become: true
  gather_facts: true

  vars:
    monitoring_dir: /opt/monitoring
    grafana_admin_password: "ChangeThisStrongPassword123!"

  tasks:

    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create Prometheus configuration directory
      ansible.builtin.file:
        path: "{{ monitoring_dir }}/prometheus"
        state: directory
        mode: "0755"

    - name: Create Grafana provisioning directory
      ansible.builtin.file:
        path: "{{ monitoring_dir }}/grafana/provisioning/datasources"
        state: directory
        mode: "0755"

    - name: Configure Prometheus
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ['prometheus:9090']

    - name: Configure Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        mode: "0644"
        content: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: true

    - name: Create Docker Compose configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/compose.yaml"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              depends_on:
                - prometheus
              ports:
                - "3000:3000"
              environment:
                GF_SECURITY_ADMIN_USER: admin
                GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
              volumes:
                - grafana_data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro

          volumes:
            prometheus_data:
            grafana_data:

    - name: Start Prometheus and Grafana
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ monitoring_dir }}"
      register: monitoring_result
      changed_when: >
        'Started' in monitoring_result.stdout or
        'Created' in monitoring_result.stdout or
        'Pulled' in monitoring_result.stderr

    - name: Display monitoring URLs
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://{{ ansible_default_ipv4.address }}:9090"
          - "Grafana: http://{{ ansible_default_ipv4.address }}:3000"
          - "Grafana username: admin"
          - "Grafana password: configured in the playbook"
