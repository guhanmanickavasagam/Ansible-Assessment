
---
- name: Install and Configure HashiCorp Vault
  hosts: server1
  become: true
  gather_facts: true

  vars:
    vault_config_dir: /etc/vault.d
    vault_data_dir: /opt/vault/data

  tasks:

    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - gpg
          - curl
        state: present

    - name: Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"

    - name: Convert HashiCorp GPG key to keyring
      ansible.builtin.command:
        cmd: >
          gpg --dearmor --yes
          --output /usr/share/keyrings/hashicorp-archive-keyring.gpg
          /usr/share/keyrings/hashicorp-archive-keyring.asc
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        filename: hashicorp
        state: present

    - name: Update package cache after adding repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install HashiCorp Vault
      ansible.builtin.apt:
        name: vault
        state: present

    - name: Create Vault data directory
      ansible.builtin.file:
        path: "{{ vault_data_dir }}"
        state: directory
        owner: vault
        group: vault
        mode: "0750"

    - name: Configure Vault server
      ansible.builtin.copy:
        dest: "{{ vault_config_dir }}/vault.hcl"
        owner: root
        group: vault
        mode: "0640"
        content: |
          ui = true
          disable_mlock = true

          storage "file" {
            path = "{{ vault_data_dir }}"
          }

          listener "tcp" {
            address = "127.0.0.1:8200"
            tls_disable = true
          }

          api_addr = "http://127.0.0.1:8200"
      notify: Restart Vault

    - name: Start and enable Vault service
      ansible.builtin.systemd:
        name: vault
        state: started
        enabled: true

    - name: Display Vault installation message
      ansible.builtin.debug:
        msg:
          - "HashiCorp Vault installed successfully!"
          - "Vault address: http://127.0.0.1:8200"
          - "Next step: Initialize and unseal Vault manually."

  handlers:
    - name: Restart Vault
      ansible.builtin.systemd:
        name: vault
        state: restarted
